name: Bug report
description: Report an error, broken link, or failing lab
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What went wrong?
      description: Describe the error, broken link, or failing test.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did you see it?
      placeholder: e.g. sem-01-cs101-programming-fundamentals / labs / lab-03
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: environment
    attributes:
      label: Your environment (optional)
      placeholder: OS, language version, browser, etc.
